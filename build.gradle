buildscript {
    repositories { mavenCentral() }
    dependencies {
        // Compiles src/assets into the jar's assets/ with a manifest; Morpheus serves plugin assets (tab JS, logos)
        // only from that layout, under /assets/plugin/<plugin-name>/.
        classpath "com.bertramlabs.plugins:asset-pipeline-gradle:$assetPipelineVersion"
    }
}

plugins {
    id 'groovy'
    id 'com.gradleup.shadow' version '9.4.1'
}

apply plugin: 'asset-pipeline'

assets {
    packagePlugin = false   // assets are packaged into the plugin jar, not a standalone bundle
}

group = 'org.hvmhealth'

// Folders synced by a cloud-drive client lock files under build/ and break Gradle's stale-output cleanup;
// set PLUGIN_BUILD_DIR to build somewhere else.
if (System.getenv('PLUGIN_BUILD_DIR')) {
    layout.buildDirectory = file(System.getenv('PLUGIN_BUILD_DIR'))
}

repositories {
    mavenCentral()
}

configurations {
    // Supplied by the Morpheus appliance at runtime; never bundled into the jar.
    provided
    implementation.extendsFrom(provided)
    testImplementation.extendsFrom(provided)
}

dependencies {
    provided("com.morpheusdata:morpheus-plugin-api:$morpheusApiVersion") { exclude group: 'org.codehaus.groovy' }
    provided "org.apache.groovy:groovy-all:$groovyVersion"
    provided("com.bertramlabs.plugins:karman-core:$karmanVersion") { exclude module: 'groovy-all' }

    testImplementation "org.spockframework:spock-core:$spockVersion"
    // MorpheusModel.get/setConfigProperty use Jackson; the appliance provides it, the plugin-api POM does not
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

// groovyc ignores options.release; source/targetCompatibility is what sets the class-file version.
java {
    sourceCompatibility = JavaVersion.toVersion(javaRelease)
    targetCompatibility = JavaVersion.toVersion(javaRelease)
}
tasks.withType(JavaCompile).configureEach { options.release = javaRelease as Integer }

// Morpheus serves plugin assets with Cache-Control max-age=1 year under a fixed name, so browsers keep running an old
// tab script after an upgrade. The template references the script with ?v=<version> to give every release a new URL.
processResources {
    inputs.property('pluginVersion', project.version)
    filesMatching('renderer/**/*.hbs') {
        filter { String line -> line.replace('@PLUGIN_VERSION@', project.version.toString()) }
    }
}

test {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
    // specs read these as files, so a change to one alone has to run them again
    inputs.dir('src/assets').withPropertyName('tabScripts').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files('docs/CHECKS.md').withPropertyName('checksDoc').withPathSensitivity(PathSensitivity.RELATIVE)
}

jar {
    manifest {
        attributes(
            'Plugin-Class'                  : 'org.hvmhealth.ClusterHealthPlugin',
            'Plugin-Version'                : project.version,
            'Morpheus-Name'                 : 'HVM Cluster Health',
            'Morpheus-Organization'         : 'HVM Cluster Health contributors',
            'Morpheus-Code'                 : 'hvm-cluster-health',
            'Morpheus-Description'          : 'Health and compliance for HVM 1.3 and 2.0 clusters: corosync, DLM, GFS2, heartbeats, multipath and network, with guarded fixes',
            'Morpheus-Logo'                 : 'assets/health.svg',
            'Morpheus-Logo-Dark'            : 'assets/health-dark.svg',
            'Morpheus-Labels'               : 'Plugin, HVM, Compliance',
            'Morpheus-Repo'                 : 'https://github.com/nburnett-io/hvm-cluster-health-morpheus-plugin',
            'Morpheus-Min-Appliance-Version': minApplianceVersion
        )
    }
}

shadowJar {
    // Only our own classes and resources: everything else is provided by the appliance.
    configurations = []
    archiveClassifier.set('all')
    // the release is also handed around on its own, so its licence goes with it
    from(rootDir) {
        include 'LICENSE', 'NOTICE'
        into 'META-INF'
    }
}

tasks.assemble.dependsOn tasks.shadowJar
